name: mykyta-portfolio

services:
  frontend:
    image: ghcr.io/pipinovi4/mykyta-portfolio-frontend:${IMAGE_TAG:-latest}

    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runner
      args:
        NODE_VERSION: 24.18.0

    container_name: mykyta-portfolio-web

    restart: unless-stopped

    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: https://mykytabozhenko.site
      PORT: "3000"
      HOSTNAME: 0.0.0.0

    ports:
      - "127.0.0.1:8080:3000"

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

    init: true

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"