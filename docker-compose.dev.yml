name: mykyta-portfolio-dev

services:
  frontend:
    container_name: mykyta-portfolio-frontend-dev

    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
      args:
        NODE_VERSION: "24"

    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SITE_URL: http://localhost:3000

    ports:
      - "3000:3000"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

    init: true

volumes:
  frontend_node_modules:
  frontend_next:
